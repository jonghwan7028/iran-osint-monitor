# Render Blueprint — Iran-US OSINT Monitor
# 사용법:
#   1. 이 저장소를 GitHub 에 푸시
#   2. Render 대시보드 → New → Blueprint → 저장소 선택
#   3. Render 가 이 파일을 읽어 자동으로 Web + Postgres + Cron 3종을 생성한다
#
# 필수 환경변수 (Render 대시보드에서 수동 설정):
#   - ADMIN_TOKEN      : 임의의 랜덤 문자열 (cron 이 /pipeline/run 호출 시 사용)
#
# 자동 설정 (render.yaml 이 연결):
#   - DATABASE_URL     : Postgres 인스턴스에서 자동 주입
#   - PUBLIC_MODE      : "1" (관리자 버튼 UI 숨김)
#   - PORT             : Render 가 자동 할당
databases:
  - name: iran-osint-db
    plan: free   # 무료 티어 (1GB). 장기 운영 시 starter ($7/mo) 권장
    databaseName: iran_osint
    user: iran_osint

services:
  # ────────────────────────────────────────────────────────────────────
  # 1) 메인 웹 서비스 (FastAPI)
  # ────────────────────────────────────────────────────────────────────
  - type: web
    name: iran-osint-web
    env: docker
    plan: free   # 무료 티어 (15분 idle 시 슬립). starter ($7/mo) 이상 권장
    autoDeploy: true
    healthCheckPath: /status
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: SITE_TITLE
        value: "이란-미국 전쟁 OSINT 실시간 모니터"
      - key: ADMIN_TOKEN
        sync: false    # 동일. `openssl rand -hex 32` 로 생성 권장
      - key: DATABASE_URL
        fromDatabase:
          name: iran-osint-db
          property: connectionString

  # ────────────────────────────────────────────────────────────────────
  # 2) 1시간마다 수집·분석 파이프라인 자동 실행
  # ────────────────────────────────────────────────────────────────────
  - type: cron
    name: iran-osint-hourly-ingest
    env: docker
    plan: free
    schedule: "0 * * * *"   # 매시 정각
    dockerCommand: |
      sh -c 'curl -fsS -X POST "$WEB_URL/pipeline/run" -H "X-Admin-Token: $ADMIN_TOKEN" --max-time 300 || echo "ingest call failed"'
    envVars:
      - key: WEB_URL
        fromService:
          type: web
          name: iran-osint-web
          property: url
      - key: ADMIN_TOKEN
        sync: false

  # ────────────────────────────────────────────────────────────────────
  # 3) 하루 1회 출력물 재생성 (좌표 보정 포함)
  # ────────────────────────────────────────────────────────────────────
  - type: cron
    name: iran-osint-daily-refresh
    env: docker
    plan: free
    schedule: "0 0 * * *"   # 매일 00:00 UTC (한국 09:00)
    dockerCommand: |
      sh -c 'curl -fsS -X POST "$WEB_URL/pipeline/refresh" -H "X-Admin-Token: $ADMIN_TOKEN" --max-time 120 || echo "refresh call failed"'
    envVars:
      - key: WEB_URL
        fromService:
          type: web
          name: iran-osint-web
          property: url
      - key: ADMIN_TOKEN
        sync: false
